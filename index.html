/* 파일 복원: v5 전체 백업이면 활성 목록·보관함을 백업 내용으로 되돌리고 사진을 합침. 이전 버전 백업이면 이전 절차로 */
async function importBackup(file){
  let j; try { j=JSON.parse(await file.text()); } catch(e){ toast("백업 파일을 읽을 수 없어요",true); return; }
  if (j.app!=="seoul-photo-spots"){ toast("이 앱의 백업 파일이 아니에요. 네이버 장소 목록이면 ‘새 JSON’을 쓰세요",true); return; }
  if ((j.version||0)<5){ await runLegacyMigration({places:j.places||[],photos:j.photos||[]},"선택한 백업 파일"); return; }
  try {
    await restoreSnapshot({label:"파일 복원",places:j.places||[],archive:j.archive||[],photoIndex:j.photoIndex||[]});
    let nf=0, skipped=0, fail=0;
    for (const ph of j.photos||[]){
      if (S.stored.photos.some(x=>x.id===ph.id)){ skipped++; continue; }
      if (!ph.fullData){ fail++; continue; }
      try { const {full,thumb}=await photoFromData(ph); const meta={...ph}; delete meta.fullData; delete meta.thumbData; meta.fullRef=await S.store.putImage(full); meta.thumbRef=await S.store.putImage(thumb); await S.store.savePhoto(meta); S.stored.photos.push(meta); nf++; } catch(e){ fail++; }
    }
    mergePlaces(); renderAll();
    toast(`복원했어요: 장소 ${S.stored.places.length}곳, 사진 ${nf}장 추가${skipped?`, 이미 있는 사진 ${skipped}장 건너뜀`:""}${fail?`, ${fail}장 실패`:""}`, !!fail);
  } catch(e){ toast(`복원 중 오류 (${e.code||e.message})`,true); }
}

/* ---------- 이전 버전(261103) 데이터 읽기: 기존 저장소는 읽기만 함 ---------- */
function readLegacyIDB(){
  return new Promise(res=>{
    let r; try { r=indexedDB.open(LEGACY_DB); } catch(e){ res(null); return; }
    r.onupgradeneeded=()=>{ try { r.transaction.abort(); } catch(e){} };   // 없는 저장소를 새로 만들지 않음
    r.onerror=e=>{ e.preventDefault?.(); res(null); };
    r.onblocked=()=>res(null);
    r.onsuccess=()=>{
      const d=r.result;
      if (!["places","photos","blobs"].every(n=>d.objectStoreNames.contains(n))){ d.close(); res(null); return; }
      const t=d.transaction(["places","photos"],"readonly"), a=t.objectStore("places").getAll(), b=t.objectStore("photos").getAll();
      t.oncomplete=()=>res({places:a.result||[],photos:b.result||[],blob:ref=>new Promise(ok=>{ const q=d.transaction("blobs","readonly").objectStore("blobs").get(ref); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }),close:()=>d.close()});
      t.onerror=()=>{ d.close(); res(null); };
    };
  });
}
function loadLegacyScript(){
  return new Promise(res=>{
    const s=document.createElement("script"); s.src=encodeURI(LEGACY_SCRIPT);
    s.onload=()=>{ const d=window.__SPM_LEGACY_BACKUP||null; s.remove(); res(d); };
    s.onerror=()=>{ s.remove(); res(null); };
    document.head.appendChild(s);
  });
}
function legacyItem(p){ return {sid:p.naver?.sid||null,bookmarkId:p.naver?.bookmarkId??null,name:p.name,displayName:"",address:p.address||"",lat:p.lat??null,lng:p.lng??null}; }
async function runLegacyMigration(data, sourceName){
  const legacyPlaces=(data.places||[]).filter(p=>!p.deleted&&p.name);
  const usedActive=new Set(), rep={source:sourceName,total:legacyPlaces.length,merged:[],archived:0,maybe:[],photos:0,photoSkipped:0,photoFailed:0,at:new Date().toISOString()};
  const idMap=new Map();
  await autoBackup("이전 데이터 가져오기 전");
  for (const lp of legacyPlaces){
    const m=matchPlace(legacyItem(lp), S.stored.places, usedActive);
    const hasPhotos=(data.photos||[]).some(x=>x.placeId===lp.id);
    if (m.rec){
      usedActive.add(m.rec.id); idMap.set(lp.id,m.rec.id);
      const rec=clone(m.rec); if(lp.memo&&!rec.memo) rec.memo=lp.memo;
      for (const k of lp.edited||[]) if (EDIT_KEYS.includes(k)&&!(k in (rec.man||{}))){ const v=getF(lp,k); if(!sameV(v,baseValue(rec,k))) (rec.man=rec.man||{})[k]=v; }
      rec.updatedAt=new Date().toISOString(); await savePlaceRecord(rec);
      rep.merged.push({name:rec.src.name,how:m.how});
    } else {
      if (S.stored.archive.some(a=>a.id===lp.id)) continue;
      const a={id:lp.id,name:lp.name,address:lp.address||"",lat:lp.lat??null,lng:lp.lng??null,sid:lp.naver?.sid||null,bookmarkId:lp.naver?.bookmarkId??null,kind:"legacy",record:lp,reason:m.maybe?`새 목록과 연결이 불확실해 자동 병합하지 않음 (${m.why})`:"새 JSON에 없는 장소",archivedAt:new Date().toISOString(),photoCount:(data.photos||[]).filter(x=>x.placeId===lp.id).length,hasUserData:hasPhotos||!!lp.memo||(lp.edited||[]).length>0};
      await S.store.saveArchive(a); S.stored.archive.push(a); rep.archived++;
      if (m.maybe) rep.maybe.push(lp.name);
    }
  }
  const list=data.photos||[];
  let i=0;
  for (const ph of list){
    i++; if(i%3===1) setNotice(`기존 사진을 옮기는 중… ${i}/${list.length}`);
    if (S.stored.photos.some(x=>x.id===ph.id)){ rep.photoSkipped++; continue; }
    try {
      let full,thumb;
      if (ph.fullData) ({full,thumb}=await photoFromData(ph));
      else if (data.blob){ full=await data.blob(ph.fullRef); thumb=await data.blob(ph.thumbRef)||full; }
      if (!full){ rep.photoFailed++; continue; }
      const meta={...ph}; delete meta.fullData; delete meta.thumbData;
      meta.placeId=idMap.get(ph.placeId)||ph.placeId||null; meta.public=false;
      meta.fullRef=await S.store.putImage(full); meta.thumbRef=await S.store.putImage(thumb);
      await S.store.savePhoto(meta); S.stored.photos.push(meta); rep.photos++;
    } catch(e){ rep.photoFailed++; }
  }
  await S.store.setMeta("legacyDone",rep);
  mergePlaces(); renderAll();
  setNotice(`기존 데이터를 옮겼어요: 공통 장소 ${rep.merged.length}곳 연결, 제외 장소 ${rep.archived}곳 보관, 사진 ${rep.photos}장 복사(모두 비공개)${rep.photoFailed?`, 실패 ${rep.photoFailed}장`:""}. 원래 파일과 저장소는 바뀌지 않아요.`);
  return rep;
}
async function autoMigrate(){
  if (await S.store.getMeta("legacyDone")) return;
  const idb=await readLegacyIDB();
  let places=[], photos=[], names=[];
  if (idb&&(idb.places.length||idb.photos.length)){ places=idb.places; photos=idb.photos; names.push("이 브라우저의 이전 저장소"); }
  const file=await loadLegacyScript();
  if (file){
    const pid=new Set(places.map(p=>p.id)), fid=new Set(photos.map(p=>p.id));
    places=places.concat((file.places||[]).filter(p=>!pid.has(p.id))); photos=photos.concat((file.photos||[]).filter(p=>!fid.has(p.id)));
    names.push("11-03 백업 파일"); delete window.__SPM_LEGACY_BACKUP;
  }
  if (!names.length) return;
  await runLegacyMigration({places,photos,blob:idb?.blob},names.join(" + "));
  idb?.close?.();
}

function parseNaver(j){
  const list=Array.isArray(j.bookmarkList)?j.bookmarkList:[], folder=j.folder||null;
  const items=list.map(naverItem);
  const expected=folder&&typeof folder.bookmarkCount==="number"?folder.bookmarkCount:null;
  return {folder:folder?{id:String(folder.folderId),name:folder.name||"이름 없는 폴더"}:null, items, expected, complete:!!folder&&expected===list.length&&!(j.unavailableCount>0)&&!j.removed, total:list.length};
}
function diffNaver(P){
  const rows=[], used=new Set(), seen=new Set();
  for (const it of P.items){

  const rem=imp.keepOld?[]:removedRecs();
  const snapSrc=(rec,it)=>{ rec.src={...rec.src,sid:it.sid,bookmarkId:it.bookmarkId,name:it.name,displayName:it.displayName,address:it.address,lat:it.lat,lng:it.lng,mcidName:it.mcidName}; };

      if (r.st==="skip") continue;

        const rec=newRecord(it,{}); if(S.stored.places.some(x=>x.id===rec.id)) rec.id="p"+uid(); await savePlaceRecord(rec); n["신규"]++; continue;

      const rec=clone(r.rec); rec.src={...rec.src,bookmarkId:it.bookmarkId,sid:it.sid}; await savePlaceRecord(rec); n["유지"]++;

function daysSince(d){ const t=Date.parse(d+"T00:00:00+09:00"); return isFinite(t)?Math.floor((Date.parse(today()+"T00:00:00+09:00")-t)/864e5):null; }
function checkRows(){
  const rows=[];
  for (const p of S.places){
    if (p.review) rows.push({p,key:null,label:"장소 변경",kind:"review",note:p.review.reason});
    for (const k of REQUIRED_KEYS){
      if ((p.edited||[]).includes(k)) continue;
      const m=p.fieldMeta?.[k], empty=k==="access"?!hasStation(p):isEmptyV(getF(p,k));
      if (empty) rows.push({p,key:k,label:FIELD_LABEL[k]||k,kind:"unknown",note:m?.note||""});
      else if (m?.k==="ref") rows.push({p,key:k,label:FIELD_LABEL[k]||k,kind:"ref",note:String(Array.isArray(getF(p,k))?(getF(p,k)||[]).map(a=>a.station||a).join(", "):getF(p,k)),at:m.at});

    }
  }

}

function parseResearch(text){

  const items=[];
  for (const e of j.places){

}

function openBulkEdit(ids){
  lastFocus=document.activeElement;
  const st={add:{seasons:new Set(),themes:new Set()},rm:{seasons:new Set(),themes:new Set()},tagAdd:"",tagRm:"",busy:"",result:null};
  const root=$("#overlayRoot");
  const row=(key,items)=>`<div class="field"><span class="lab">${key==="seasons"?"계절":"테마"} 추가</span><div class="checks">${items.map(v=>`<label><input type="checkbox" data-b="add|${key}|${esc(v)}" ${st.add[key].has(v)?"checked":""}>${esc(v)}</label>`).join("")}</div></div>
     <div class="field"><span class="lab">${key==="seasons"?"계절":"테마"} 빼기</span><div class="checks">${items.map(v=>`<label><input type="checkbox" data-b="rm|${key}|${esc(v)}" ${st.rm[key].has(v)?"checked":""}>${esc(v)}</label>`).join("")}</div></div>`;
  const draw=()=>{ root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="beT"><div class="panel narrow">
    <div class="panel-head"><h2 id="beT">${ids.length}곳 일괄 편집</h2><button type="button" class="btn small" data-be="close">닫기</button></div>
    <div class="panel-body">
      <p class="fine" style="margin:0">${esc(ids.map(id=>getPlace(id)?.name).filter(Boolean).slice(0,8).join(", "))}${ids.length>8?` 외 ${ids.length-8}곳`:""}</p>
      ${row("seasons",SEASONS)}${row("themes",THEMES)}
      <div class="frow"><div class="field"><label for="beTA">유형 태그 추가 (쉼표 구분)</label><input id="beTA" value="${esc(st.tagAdd)}"></div><div class="field"><label for="beTR">유형 태그 빼기</label><input id="beTR" value="${esc(st.tagRm)}"></div></div>
      ${st.result?`<div class="counts" role="status"><span>변경 ${st.result.ok}곳</span><span>변화 없음 ${st.result.same}곳</span>${st.result.fail.length?`<span style="color:var(--danger)">실패 ${esc(st.result.fail.join(", "))}</span>`:""}</div>`:""}
      <span class="progress">${esc(st.busy)}</span>
    </div>
    <div class="panel-foot"><button type="button" class="btn primary" data-be="apply">적용</button></div></div></div>`; };
  draw();
  root.onchange=e=>{ const t=e.target; if(t.dataset.b){ const [m,key,v]=t.dataset.b.split("|"); const s=st[m][key]; t.checked?s.add(v):s.delete(v); } else if(t.id==="beTA") st.tagAdd=t.value; else if(t.id==="beTR") st.tagRm=t.value; };
  root.onclick=async e=>{
    const b=e.target.closest("[data-be]"); if(!b) return;
    if (b.dataset.be==="close"){ root.onchange=null; root.onclick=null; root.innerHTML=""; renderAll(); lastFocus?.focus?.(); return; }
    st.tagAdd=$("#beTA").value; st.tagRm=$("#beTR").value;
    const ta=st.tagAdd.split(/[,，]/).map(x=>x.trim()).filter(Boolean), tr=new Set(st.tagRm.split(/[,，]/).map(x=>x.trim()).filter(Boolean));
    let ok=0,same=0; const fail=[];
    for (const id of ids){
      const p=getPlace(id), rec=storedOf(id); if(!p||!rec) continue;
      const u=clone(rec); u.man=u.man||{}; let ch=false;
      for (const key of ["seasons","themes"]){
        const prev=p[key]||[]; let arr=prev.filter(v=>!st.rm[key].has(v)); st.add[key].forEach(v=>{ if(!arr.includes(v)) arr.push(v); });
        if (arr.length!==prev.length || arr.some(v=>!prev.includes(v))){ const order=key==="seasons"?SEASONS:THEMES; arr.sort((x,y)=>order.indexOf(x)-order.indexOf(y)); u.man[key]=arr; ch=true; }
      }
      let tags=(p.tags||[]).filter(t=>!tr.has(t)); ta.forEach(t=>{ if(!tags.includes(t)) tags.push(t); });
      if (JSON.stringify(tags)!==JSON.stringify(p.tags||[])){ u.man.tags=tags; ch=true; }
      if (!ch){ same++; continue; }
      u.updatedAt=new Date().toISOString();
      st.busy=`${ok+same+fail.length+1}/${ids.length} 저장 중…`;
      try { await savePlaceRecord(u); ok++; } catch(err){ fail.push(p.name); }
    }
    mergePlaces(); st.busy=""; st.result={ok,same,fail}; draw(); refreshResults();
  };
}

/* =====================================================================
   16. 철도망 (OSM 선형) — 데이터 읽기, 지도 레이어, 역명 라벨, 노선 강조
       데이터: data/rail.json (빌드 때 HTML 안 <script id="railData">에 넣을 수도 있음)
   ===================================================================== */
const RAIL_URL = "data/rail.json";
const RAIL = { state:"idle", err:"", d:null, hidden:new Set(), focus:null, labels:[], adj:null, route:null,
  from:null, to:null, crit:"transfer", allowUnver:false, q:{from:"",to:""} };
function railPrefsLoad(){ try { const o=JSON.parse(localStorage.getItem("spm-rail")||"{}"); (o.hidden||[]).forEach(x=>RAIL.hidden.add(x)); if(o.crit) RAIL.crit=o.crit; } catch(e){} }
function railPrefsSave(){ try { localStorage.setItem("spm-rail",JSON.stringify({hidden:[...RAIL.hidden],crit:RAIL.crit})); } catch(e){} }

async function loadRail(){
  RAIL.state="loading"; renderSheet();
  try {
    let j=null;
    const emb=document.getElementById("railData");
    if (emb && emb.textContent.trim().length>2) j=JSON.parse(emb.textContent);
    else {
      let r;
      try { r=await fetch(RAIL_URL,{cache:"no-cache"}); }
      catch(e){ throw new Error("철도 데이터 파일에 연결하지 못했어요 ("+(e.message||"네트워크 오류")+")"); }
      if (r.status===404) { RAIL.state="empty"; RAIL.err="data/rail.json 파일이 없어요"; renderSheet(); return; }
      if (!r.ok) throw new Error("철도 데이터 요청 실패 (HTTP "+r.status+")");
      j=await r.json();
    }
    if (!j || !Array.isArray(j.lines) || !j.lines.length || !Array.isArray(j.stations)){ RAIL.state="empty"; RAIL.err="철도 데이터가 비어 있어요"; renderSheet(); return; }
    prepRail(j); RAIL.state="ready";
  } catch(e){ RAIL.state="fail"; RAIL.err=e.message||String(e); }
  renderSheet(); syncRail(); if(S.sel) renderDetail();
}
function prepRail(j){
  const d={...j};
  d.lineIdx=new Map(j.lines.map((l,i)=>[l.id,i]));
  d.st=j.stations.map((s,i)=>({...s, i, li:s.lines.map(id=>d.lineIdx.get(id)).filter(x=>x!=null)}));
  d.adj=new Map();
  j.edges.forEach((e,k)=>{ const [a,b,l]=e; for(const [x,y] of [[a,b],[b,a]]){ const key=x+"|"+l; if(!d.adj.has(key)) d.adj.set(key,[]); d.adj.get(key).push({to:y,e:k}); } });
  d.tr=new Map(); // station -> Map(pairKey -> {kind, m})
  for (const [si,pairs] of Object.entries(j.transfers||{})) for (const [pk,m] of Object.entries(pairs)){ if(!d.tr.has(+si)) d.tr.set(+si,new Map()); d.tr.get(+si).set(pk,{kind:"osm",m}); }
  for (const [si,pks] of Object.entries(j.manualTransfers||{})) for (const pk of pks){ if(!d.tr.has(+si)) d.tr.set(+si,new Map()); if(!d.tr.get(+si).has(pk)) d.tr.get(+si).set(pk,{kind:"manual",m:null}); }
  d.links=(j.links||[]).map(([a,la,b,lb,m])=>({a,la,b,lb,m}));
  d.exitsBy=new Map();
  for (const x of j.exits||[]){ const sid=x[3]; if(!d.exitsBy.has(sid)) d.exitsBy.set(sid,[]); d.exitsBy.get(sid).push({lng:x[0],lat:x[1],no:x[2]}); }
  RAIL.d=d;
}
function trKind(si, la, lb){
  const d=RAIL.d, A=d.lines[la].id, B=d.lines[lb].id, pk=[A,B].sort().join("|");
  return d.tr.get(si)?.get(pk) || null;
}
const railVisible = li => !RAIL.hidden.has(RAIL.d.lines[li].id);
function lineDots(lis){ return `<span class="dots">${lis.map(li=>`<i style="--lc:${esc(RAIL.d.lines[li].color||"#888")}" title="${esc(RAIL.d.lines[li].name)}"></i>`).join("")}</span>`; }
function stLabel(s){ return `${esc(s.name)} ${lineDots(s.li)}`; }

function railLineFC(){
  return {type:"FeatureCollection",features:RAIL.d.lines.map((l,li)=>({type:"Feature",properties:{li,c:l.color||"#888"},geometry:{type:"MultiLineString",coordinates:l.geom}}))};
}
function railStFC(){
  const f=[];
  for (const s of RAIL.d.st){
    const vis=s.li.filter(railVisible); if(!vis.length) continue;
    const isTr=s.li.length>1 || RAIL.d.links.some(k=>k.a===s.i||k.b===s.i);
    const foc=RAIL.focus==null || s.li.includes(RAIL.focus);
    f.push({type:"Feature",properties:{i:s.i,tr:isTr?1:0,c:RAIL.d.lines[vis[0]].color||"#888",f:foc?1:0},geometry:{type:"Point",coordinates:[s.lng,s.lat]}});
  }
  return {type:"FeatureCollection",features:f};
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888"; }
function addRailLayers(m){
  const emptyFC={type:"FeatureCollection",features:[]};
  m.addSource("rail-ln",{type:"geojson",data:emptyFC});
  m.addSource("rail-st",{type:"geojson",data:emptyFC});
  m.addSource("route",{type:"geojson",data:emptyFC});
  m.addLayer({id:"rail-case",type:"line",source:"rail-ln",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":cssVar("--surface"),"line-width":["interpolate",["linear"],["zoom"],9,2.5,13,6,16,9],"line-opacity":0.85}});
  m.addLayer({id:"rail-line",type:"line",source:"rail-ln",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":["get","c"],"line-width":["interpolate",["linear"],["zoom"],9,1.4,13,3.5,16,6]}});
  m.addLayer({id:"route-case",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":cssVar("--ink"),"line-width":["interpolate",["linear"],["zoom"],9,7,14,13]}});
  m.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":["get","c"],"line-width":["interpolate",["linear"],["zoom"],9,4,14,8]}});
  const TR=["==",["get","tr"],1];
  m.addLayer({id:"rail-st",type:"circle",source:"rail-st",minzoom:10.5,
    paint:{"circle-radius":["interpolate",["linear"],["zoom"],10.5,["case",TR,3,0],11.9,["case",TR,4,0],12,["case",TR,4.2,2.5],14,["case",TR,6,4.5]],
      "circle-color":cssVar("--surface"),"circle-stroke-color":["case",["==",["get","tr"],1],cssVar("--ink"),["get","c"]],"circle-stroke-width":["case",["==",["get","tr"],1],2,2],
      "circle-opacity":["case",["==",["get","f"],1],1,0.25],"circle-stroke-opacity":["case",["==",["get","f"],1],1,0.25]}});
}
function bindRailHandlers(m){
  m.on("click","rail-st",e=>{ if(MAP.pick) return; const f=e.features[0]; stationPopup(+f.properties.i, e.lngLat); });
  m.on("mouseenter","rail-st",()=>{ m.getCanvas().style.cursor="pointer"; });
  m.on("mouseleave","rail-st",()=>{ m.getCanvas().style.cursor=MAP.pick?"crosshair":""; });
}
function syncRail(){
  if (!MAP.m || MAP.state!=="ready" || !MAP.m.getSource("rail-ln")) return;
  const m=MAP.m, on=MAP.app.rail && RAIL.state==="ready";
  for (const id of ["rail-case","rail-line","rail-st"]) m.setLayoutProperty(id,"visibility",on?"visible":"none");
  if (!on){ m.getSource("rail-ln").setData({type:"FeatureCollection",features:[]}); clearLabels(); syncRoute(); return; }
  m.getSource("rail-ln").setData(railLineFC());
  m.getSource("rail-st").setData(railStFC());
  const hid=[...RAIL.hidden].map(id=>RAIL.d.lineIdx.get(id)).filter(x=>x!=null);
  const filt=["!",["in",["get","li"],["literal",hid]]];
  m.setFilter("rail-line",filt); m.setFilter("rail-case",filt);
  const fop=RAIL.focus==null?1:["case",["==",["get","li"],RAIL.focus],1,0.15];
  m.setPaintProperty("rail-line","line-opacity",RAIL.route?0.35:fop);
  syncRoute(); updateLabels();
}
function themeRefreshRail(){
  if (!MAP.m || !MAP.m.getLayer("rail-case")) return;
  MAP.m.setPaintProperty("rail-case","line-color",cssVar("--surface"));
  MAP.m.setPaintProperty("route-case","line-color",cssVar("--ink"));
  MAP.m.setPaintProperty("rail-st","circle-color",cssVar("--surface"));
  MAP.m.setPaintProperty("rail-st","circle-stroke-color",["case",["==",["get","tr"],1],cssVar("--ink"),["get","c"]]);
}
/* 역명: 확대 수준에 따라 환승역 → 일반역 순서로, 화면에서 겹치지 않는 것만 표시 */
function clearLabels(){ RAIL.labels.forEach(x=>x.remove()); RAIL.labels=[]; }
function updateLabels(){
  clearLabels();
  if (!MAP.m || MAP.state!=="ready" || RAIL.state!=="ready" || !MAP.app.rail) return;
  const m=MAP.m, z=m.getZoom(), b=m.getBounds(), W=m.getContainer().clientWidth, H=m.getContainer().clientHeight;
  const routeSt=new Set(RAIL.route? RAIL.route.legs.flatMap(l=>[l.st[0],l.st[l.st.length-1]]) : []);
  const cands=[];
  for (const s of RAIL.d.st){
    if (!s.li.some(railVisible)) continue;
    if (!b.contains([s.lng,s.lat])) continue;
    const tr=s.li.length>1, rt=routeSt.has(s.i);
    if (rt) continue; // 출발·도착 표지가 이름을 보여 줌
    if (RAIL.focus!=null && !s.li.includes(RAIL.focus) && !rt) continue;
    const need = rt ? 9 : tr ? 11.6 : 12.8;
    if (z<need) continue;
    cands.push({s,tr,rt,pr:rt?0:tr?1:2});
  }
  cands.sort((a,b)=>a.pr-b.pr);
  const boxes=[], max=isMobile()?45:90;
  for (const c of cands){
    if (RAIL.labels.length>=max) break;
    const p=m.project([c.s.lng,c.s.lat]), w=c.s.name.length*12+12, h=18;
    const bx={x1:p.x-w/2,x2:p.x+w/2,y1:p.y-26,y2:p.y-26+h};
    if (bx.x1<0||bx.x2>W||bx.y1<0||bx.y2>H) continue;
    if (boxes.some(o=>!(bx.x2<o.x1||bx.x1>o.x2||bx.y2<o.y1||bx.y1>o.y2))) continue;
    boxes.push(bx);
    const el=document.createElement("span"); el.className="stlbl"+(c.tr?" tr":"")+(c.rt?" rt":""); el.textContent=c.s.name;
    RAIL.labels.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([c.s.lng,c.s.lat]).addTo(m));
  }
}

/* =====================================================================
   17. 역 간 경로 찾기 — 역 연결(선형 위 순서)과 확인된 환승만 사용. 시간표·급행·운행 계통은 반영하지 않음
   ===================================================================== */
function findRoute(from, to){
  const d=RAIL.d, crit=RAIL.crit, allowU=RAIL.allowUnver;
  const W = crit==="transfer" ? {ride:1, xfer:10000} : {ride:1000, xfer:1};
  const key=(s,l)=>s+"|"+l, dist=new Map(), prev=new Map(), heap=[];
  const push=(c,k)=>{ heap.push([c,k]); let i=heap.length-1; while(i>0){ const p=(i-1)>>1; if(heap[p][0]<=heap[i][0]) break; [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=2*i+1,r=l+1; let m=i; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===i) break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } return top; };
  for (const l of d.st[from].li) if (railVisible(l)){ dist.set(key(from,l),0); push(0,key(from,l)); }
  let goal=null, usedUnver=false;
  while (heap.length){
    const [c,k]=pop(); if (c>(dist.get(k)??Infinity)) continue;
    const [s,l]=k.split("|").map(Number);
    if (s===to){ goal=k; break; }
    const relax=(nk,nc,info)=>{ if (nc<(dist.get(nk)??Infinity)){ dist.set(nk,nc); prev.set(nk,{k,info}); push(nc,nk); } };
    for (const n of d.adj.get(key(s,l))||[]) relax(key(n.to,l), c+W.ride, {type:"ride",e:n.e});
    for (const l2 of d.st[s].li){
      if (l2===l || !railVisible(l2)) continue;
      const tk=trKind(s,l,l2);
      if (!tk && !allowU) continue;
      relax(key(s,l2), c+W.xfer, {type:"xfer",kind:tk?tk.kind:"unverified",m:tk?tk.m:null});
    }
    for (const lk of d.links){
      if (lk.a===s && lk.la===l && railVisible(lk.lb)) relax(key(lk.b,lk.lb), c+W.xfer, {type:"xfer",kind:"manual-link",m:lk.m});
      if (lk.b===s && lk.lb===l && railVisible(lk.la)) relax(key(lk.a,lk.la), c+W.xfer, {type:"xfer",kind:"manual-link",m:lk.m});
    }
  }
  if (!goal) return null;
  const steps=[]; let k=goal;
  while (prev.has(k)){ const p=prev.get(k); steps.unshift({from:p.k,to:k,info:p.info}); k=p.k; }
  const legs=[], xfers=[];
  let cur=null;
  for (const st of steps){
    const [s1,l1]=st.from.split("|").map(Number), [s2,l2]=st.to.split("|").map(Number);
    if (st.info.type==="ride"){
      if (!cur || cur.li!==l1){ cur={li:l1,st:[s1],e:[]}; legs.push(cur); }
      cur.st.push(s2); cur.e.push(st.info.e);
    } else { xfers.push({at:s1, to:s2, from:l1, toLine:l2, kind:st.info.kind, m:st.info.m}); if(st.info.kind==="unverified") usedUnver=true; cur=null; }
  }
  return {legs, xfers, stops:legs.reduce((a,l)=>a+l.e.length,0), usedUnver, from, to};
}
function runRoute(){
  RAIL.route=null; RAIL.routeMsg="";
  if (RAIL.state!=="ready" || RAIL.from==null || RAIL.to==null){ renderSheet(); syncRail(); return; }
  if (RAIL.from===RAIL.to){ RAIL.routeMsg="출발역과 도착역이 같아요."; renderSheet(); syncRail(); return; }
  const r=findRoute(RAIL.from,RAIL.to);
  if (!r){
    let why="현재 데이터의 역 연결과 확인된 환승만으로는 경로를 찾지 못했어요.";
    if (!RAIL.allowUnver){ const saved=RAIL.allowUnver; RAIL.allowUnver=true; const r2=findRoute(RAIL.from,RAIL.to); RAIL.allowUnver=saved; if(r2) why+=" ‘미확인 환승 포함’을 켜면 미확인 환승을 지나는 경로가 있어요."; }
    if (RAIL.hidden.size) why+=" 숨긴 노선은 경로에서 빼고 있어요.";
    RAIL.routeMsg=why; renderSheet(); syncRail(); return;
  }
  RAIL.route=r; renderSheet(); syncRail(); fitRoute();
}
function syncRoute(){
  if (!MAP.m || !MAP.m.getSource("route")) return;
  MAP.rtMk?.forEach(x=>x.remove()); MAP.rtMk=[];
  const r=RAIL.route, on=r && MAP.app.rail && RAIL.state==="ready";
  if (!on){ MAP.m.getSource("route").setData({type:"FeatureCollection",features:[]}); return; }
  const feats=r.legs.map(l=>{
    const co=[]; l.e.forEach((ei,k)=>{ const [a,b,,g]=RAIL.d.edges[ei]; const forward = a===l.st[k]; const seg=forward?g:g.slice().reverse(); co.push(...(co.length?seg.slice(1):seg)); });
    return {type:"Feature",properties:{c:RAIL.d.lines[l.li].color||"#888"},geometry:{type:"LineString",coordinates:co}};
  });
  MAP.m.getSource("route").setData({type:"FeatureCollection",features:feats});
  const mk=(si,t)=>{ const s=RAIL.d.st[si], el=document.createElement("span"); el.className="rtend"; el.textContent=t+" "+s.name; MAP.rtMk.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([s.lng,s.lat]).addTo(MAP.m)); };
  mk(r.from,"출발"); mk(r.to,"도착");
}
function fitRoute(){
  if (!MAP.m || MAP.state!=="ready" || !RAIL.route) return;
  const b=new maplibregl.LngLatBounds();
  RAIL.route.legs.forEach(l=>l.st.forEach(si=>b.extend([RAIL.d.st[si].lng,RAIL.d.st[si].lat])));
  MAP.m.fitBounds(b,{padding:isMobile()?{top:70,bottom:Math.round(innerHeight*0.5),left:30,right:40}:{top:70,bottom:60,left:50,right:420},maxZoom:14,duration:0});
}
function searchStations(q){
  q=q.trim().replace(/역$/,""); if(!q||RAIL.state!=="ready") return [];
  const n=normName(q);
  return RAIL.d.st.filter(s=>normName(s.name).includes(n)).sort((a,b)=>(normName(a.name).startsWith(n)?0:1)-(normName(b.name).startsWith(n)?0:1)||a.name.length-b.name.length).slice(0,12);
}
/* 출사지 주변 역: 역 묶음 좌표·OSM 출입구 좌표와의 직선거리 (걷는 길이 아님) */
function nearStationsRail(p, n=3){
  if (RAIL.state!=="ready" || !hasCoord(p)) return [];
  return RAIL.d.st.map(s=>{ const ex=RAIL.d.exitsBy.get(s.id)||[]; let be=null; for(const x of ex){ const dd=distM(p,x); if(!be||dd<be.d) be={d:dd,no:x.no}; } return {s,d:distM(p,s),ex:be}; })
    .filter(x=>x.d<=2000).sort((a,b)=>a.d-b.d).slice(0,n);
}
function fmtM(m){ return m>=1000?(m/1000).toFixed(1)+"km":Math.round(m/10)*10+"m"; }
function nearHTML(p){

}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(S.theme==="system") applyMapTheme(); });

/* 시트·경로·해달 공통 이벤트 */
$("#toolSheet").addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");
  if (tb){ S.sheetTab=tb.dataset.tab; S.sheetOpen=true; RAIL.sugg=null; renderSheet(); return; }
  if (e.target.closest("#sheetX")){ S.sheetOpen=!S.sheetOpen; renderSheet(); return; }
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if (a==="rail-retry") loadRail();
  else if (a==="rail-toggle"){ MAP.app.rail=!MAP.app.rail; saveLayerPrefs(); renderLayerChips(); syncRail(); renderSheet(); }
  else if (a==="ln-all"){ RAIL.hidden.clear(); railPrefsSave(); syncRail(); renderSheet(); if(RAIL.from!=null&&RAIL.to!=null) runRoute(); }
  else if (a==="ln-none"){ RAIL.d.lines.forEach(l=>RAIL.hidden.add(l.id)); RAIL.focus=null; railPrefsSave(); syncRail(); renderSheet(); }
  else if (a==="ln-focus"){ const li=+t.dataset.li; RAIL.focus = RAIL.focus===li?null:li; if(RAIL.focus!=null) RAIL.hidden.delete(RAIL.d.lines[li].id); syncRail(); renderSheet(); if(RAIL.focus!=null) fitLine(li); }
  else if (a==="ln-unfocus"){ RAIL.focus=null; syncRail(); renderSheet(); }
  else if (a==="rt-from"||a==="rt-to"){ const which=a==="rt-from"?"from":"to"; RAIL[which]=+t.dataset.st; RAIL.q[which]=""; RAIL.sugg=null; MAP.stPop?.remove(); S.sheetTab="route"; S.sheetOpen=true; if(isMobile()&&a==="rt-to"&&t.closest("#detailBody")){ setView("map"); } runRoute(); }
  else if (a==="rt-pick"){ const w=t.dataset.which; RAIL[w]=+t.dataset.st; RAIL.q[w]=""; RAIL.sugg=null; runRoute(); }
  else if (a==="rt-swap"){ [RAIL.from,RAIL.to]=[RAIL.to,RAIL.from]; [RAIL.q.from,RAIL.q.to]=[RAIL.q.to,RAIL.q.from]; runRoute(); }
  else if (a==="rt-clear"){ RAIL.from=RAIL.to=null; RAIL.q={from:"",to:""}; RAIL.route=null; RAIL.routeMsg=""; RAIL.sugg=null; renderSheet(); syncRail(); }
  else if (a==="rt-crit"){ RAIL.crit=t.dataset.v; railPrefsSave(); runRoute(); }
  else if (a==="obs-pick"){
    const ok=startPick(ll=>{ S.obsCustom={lat:+ll.lat.toFixed(6),lng:+ll.lng.toFixed(6),name:"지도에서 고른 지점",kind:"custom"}; S.sheetTab="astro"; S.sheetOpen=true; renderSheet(); rerenderAstro(); toast("관측 위치를 바꿨어요"); }, "해·달을 볼 관측 위치를 지도에서 눌러 주세요.");
    if (!ok) toast("지도가 표시되지 않아 지도에서 고를 수 없어요",true);
  }
  else if (a==="obs-clear"){ S.obsCustom=null; renderSheet(); rerenderAstro(); }
  else if (a==="day"){ S.sun.date=addDays(S.sun.date||today(),+t.dataset.n); S.sun.min=S.sun.min; S.calMonth=null; rerenderAstro(); }
  else if (a==="cal-toggle"){ S.calOpen=!S.calOpen; S.calMonth=null; rerenderAstro(); }
  else if (a==="cal-mon"){ const base=(S.calMonth||(S.sun.date||today()).slice(0,7))+"-15"; S.calMonth=addDays(base,+t.dataset.n*30).slice(0,7); rerenderAstro(); }
  else if (a==="cal-pick"){ S.sun.date=t.dataset.d; S.calMonth=t.dataset.d.slice(0,7); rerenderAstro(); }
  else if (a==="amode"){ S.astroMode=t.dataset.v; rerenderAstro(); }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if (t.classList && t.classList.contains("a-min")){ S.sun.min=+t.value; quickAstro(); cancelAnimationFrame(sunRaf); sunRaf=requestAnimationFrame(syncSunOnMap); }
  else if (t.dataset && t.dataset.rtq){ const w=t.dataset.rtq; RAIL.q[w]=t.value; RAIL[w]=null; RAIL.route=null; RAIL.routeMsg=""; RAIL.sugg=w; syncRail(); renderSheet(); const el=document.getElementById("rt-"+w); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if (t.classList && t.classList.contains("a-date") && /^\d{4}-\d{2}-\d{2}$/.test(t.value)){ S.sun.date=t.value; S.calMonth=null; rerenderAstro(); }
  else if (t.id==="rtUnver"){ RAIL.allowUnver=t.checked; runRoute(); }
  else if (t.dataset && t.dataset.ln){ const id=t.dataset.ln; t.checked?RAIL.hidden.delete(id):RAIL.hidden.add(id); if(RAIL.focus!=null&&RAIL.hidden.has(RAIL.d.lines[RAIL.focus].id)) RAIL.focus=null; railPrefsSave(); syncRail(); renderSheet(); if(RAIL.from!=null&&RAIL.to!=null) runRoute(); }
});
function fitLine(li){
  if (!MAP.m || MAP.state!=="ready") return;
  const b=new maplibregl.LngLatBounds(); RAIL.d.lines[li].geom.forEach(g=>g.forEach(c=>b.extend(c)));
  MAP.m.fitBounds(b,{padding:isMobile()?{top:70,bottom:Math.round(innerHeight*0.5),left:30,right:40}:{top:70,bottom:60,left:50,right:420},maxZoom:13,duration:0});
}

/* =====================================================================
   21. 공개용 내보내기 — 이 앱의 코드 + 공개 표시한 데이터만 담은 읽기 전용 HTML 한 파일.
       방문자 쪽에는 저장·편집 기능이 동작하지 않음 (HTML에 비밀번호·키가 없고, 편집 기능을 숨기는 방식도 아님:
       공개 파일에는 개인 데이터가 처음부터 들어 있지 않음)
   ===================================================================== */
class PublicStore {
  constructor(data, preview){ this.mode=preview?"preview":"public"; this.canWrite=false; this.flat=true; this.data=data; this.urls=new Map(); }
  async loadAll(){ return {places:this.data.places||[], archive:[], photos:(this.data.photos||[]).map(p=>{ const x={...p}; delete x.fullData; delete x.thumbData; return x; })}; }
  async url(ref){
    if (this.urls.has(ref)) return this.urls.get(ref);
    const ph=(this.data.photos||[]).find(p=>p.fullRef===ref||p.thumbRef===ref); if(!ph) return null;
    const src = ph.fullRef===ref ? ph.fullData : (ph.thumbData||ph.fullData);
    if (!src) return null;
    this.urls.set(ref,src); return src;
  }
  async getMeta(){ return null; }
}
function pubPlace(p){
  const c=clone(p);
  for (const k of ["edited","origin","addedAt","updatedAt","public","memoPublic","_for","_latRaw","_lngRaw"]) delete c[k];
  if (!p.memoPublic) c.memo=null;
  c.visits=(p.visits||[]).filter(v=>v.public).map(v=>({date:v.date,note:v.note}));
  c.naver=p.naver?.sid?{sid:p.naver.sid}:undefined;
  if (c.review) c.review={reason:c.review.reason};
  return c;
}
async function rescale(ref,max,q){
  const b=await S.store.getBlob(ref); if(!b) return null;
  const bmp=await decode(b); const out=await toJpeg(bmp,max,q); bmp.close?.();
  return await blobToDataURL(out);
}
async function buildPublicData(onProgress){
  const pub=S.places.filter(p=>p.public!==false), ids=new Set(pub.map(p=>p.id));
  const photos=[], list=S.photos.filter(x=>x.public&&x.placeId&&ids.has(x.placeId));
  let i=0;
  for (const ph of list){
    i++; onProgress?.(`사진 준비 중 ${i}/${list.length}`);
    photos.push({id:ph.id,placeId:ph.placeId,fullRef:ph.id+"f",thumbRef:ph.id+"t",w:ph.w,h:ph.h,caption:ph.caption||"",takenAt:ph.takenAt||"",season:ph.season||"",time:ph.time||"",shot:ph.shot||"",order:ph.order||0,cover:!!ph.cover,fullData:await rescale(ph.fullRef,1600,.82),thumbData:await rescale(ph.thumbRef||ph.fullRef,480,.75)});
  }
  return {app:"seoul-photo-map-public",version:APP_VERSION,builtAt:new Date().toISOString(),places:pub.map(pubPlace),photos};
}
function buildPublicHtml(d){
  const json=JSON.stringify(d).replace(/</g,"\\u003c");
  const open='<script type="application/json" id="seed'+'Data">', close='</scr'+'ipt>';
  let h=PRISTINE_HTML;
  const a=h.indexOf(open); if(a<0) throw new Error("문서 구조를 찾지 못했어요");
  const b=h.indexOf(close,a);
  h=h.slice(0,a)+'<script type="application/json" id="publicData">'+json+h.slice(b);
  h=h.replace('<meta name="spm-mode" content="editor">','<meta name="spm-mode" content="public">');
  return "<!doctype html>\n"+h;
}
async function exportPublic(){
  try {
    if (!S.places.some(p=>p.public!==false)){ toast("공개할 장소가 없어요",true); return; }
    const el=$("#dtBusy"), prog=t=>{ if(el) el.textContent=t; };
    toast("공개용 파일을 만드는 중…");
    const d=await buildPublicData(prog), html=buildPublicHtml(d);
    saveFile("index.html", html, "text/html");
    prog("");
    toast(`index.html을 저장했어요 (장소 ${d.places.length}곳, 사진 ${d.photos.length}장, ${(html.length/1048576).toFixed(1)}MB)`);
  } catch(e){ toast(`만들지 못했어요 (${e.message||e.code})`, true); }
}
async function previewPublic(){
  const d=await buildPublicData();
  S.realStore=S.store; S.realStored=S.stored;
  S.store=new PublicStore(d,true); S.stored=await S.store.loadAll(); S.previewing=true;
  setStatus(); mergePlaces(); S.sel=null; renderAll();
  toast("공개 화면 미리보기예요. 방문자에게 보일 장소·사진만 나와요", false, {label:"미리보기 끝내기", fn:endPreview});
}
async function endPreview(){
  if (!S.previewing) return;
  S.store=S.realStore; S.stored=S.realStored; S.previewing=false; setStatus(); mergePlaces(); S.sel=null; renderAll();
}

/* =====================================================================
   15. 시작: 내장된 새 장소 목록으로 먼저 그리고, 저장소가 준비되면 내 기록을 합침
   ===================================================================== */
function setStatus(){
  const m=S.store?.mode, el=$("#statusBtn");
  el.dataset.mode = ["public","preview"].includes(m) ? "cloud" : m;
  $("#statusText").textContent = m==="public" ? "공개 화면 · 읽기 전용" : m==="preview" ? "공개 미리보기 · 눌러서 끝내기" : m==="local" ? "이 브라우저에만 저장" : "임시 · 저장 안 됨";
  const w=!!S.store?.canWrite;
  $("#editBtn").hidden=!w; $("#importBtn").hidden=!w; $("#enrichBtn").hidden=!w; $("#dataBtn").hidden=!w;
}
function readPublicData(){ const emb=document.getElementById("publicData"); if(!emb) return {places:[],photos:[]}; try { return JSON.parse(emb.textContent); } catch(e){ return {places:[],photos:[]}; } }
async function boot(){
  let th="system"; try { th=localStorage.getItem("spm-theme")||"system"; } catch(e){}
  applyTheme(["system","light","dark"].includes(th)?th:"system", false);
  loadLayerPrefs(); railPrefsLoad();
  setView("list"); S.sun.date=today();
  if (PUBLIC_MODE){
    S.store=new PublicStore(readPublicData(),false); S.stored=await S.store.loadAll();
    document.querySelector('.brand p').textContent="읽기 전용 공개 지도";
    setStatus(); mergePlaces(); renderAll(); renderSheet(); initMap(); loadRail();
    return;
  }
  S.stored.places=seedRecords(); mergePlaces(); renderAll(); renderSheet(); initMap(); loadRail();
  let store=null;
  try { if(!("indexedDB" in window)) throw new Error("no idb"); store=await new LocalStore().open(); }
  catch(e){ store=new MemoryStore(); }
  S.store=store;
  try {
    const seedId=SEED?.datasetId;
    const known=await store.getMeta("datasetId");
    if (!known){ for (const r of S.stored.places) await store.savePlace(r); await store.setMeta("datasetId",seedId); }
    S.stored=await store.loadAll();
    setStatus(); mergePlaces(); renderAll();
    if (known&&seedId&&known!==seedId){
      toast("이 HTML에 더 새로운 내장 목록이 있어요",false,{label:"비교해서 적용",fn:async()=>{ openNaverImport(JSON.stringify({folder:null,bookmarkList:SEED.bookmarks})); await store.setMeta("datasetId",seedId); }});
    }
    await autoMigrate();
  } catch(e){ console.error(e); setStatus(); toast("저장소를 읽지 못해 임시로 표시 중이에요",true); }
}
boot();
</script></body></html>
